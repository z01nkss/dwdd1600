<!doctype html>
<html lang="en">

<head>
    <meta name="description" content="Your Pit Stop for F1 News">

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="f1.css">

    <meta charset="UTF-8">
    <title>Pit Wall: Contact</title>
</head>

<body>
    <!-- start the page header -->
    <header>
        <span>Pit Wall</span>
    </header>

    <!-- start the page navigation -->
    <nav>
        <ul>
            <li><a href="index.html">Races</a></li>
            <li><a href="drivers.html">Drivers</a></li>
            <li><a href="teams.html">Teams</a></li>
            <li><a href="contact.html" class="active">Contact Us</a></li>
        </ul>
    </nav>

    <!-- start the page main -->
    <main>
        <h1>Fan Contact Form</h1>

        <form method="get" class="myForm" action="thanks.html">
            <fieldset>
                <legend>Personal Information</legend>
                <label>Full Name* <input type="text" name="fname" required> </label>
                <label>Email Address* <input type="email" name="email" required placeholder="you@pitwall.com"> </label>
                <label>Phone Number* <input type="tel" name="phone" required placeholder="e.g. +1 (555) 444-3333">
                </label>
            </fieldset>
            <fieldset>
                <legend>Favorite Team</legend>
                <label> <input type="radio" name="team" value="mercedes"> Mercedes </label>
                <label> <input type="radio" name="team" value="ferrari"> Ferrari </label>
                <label> <input type="radio" name="team" value="mclaren"> McLaren </label>
                <label> <input type="radio" name="team" value="redbull"> Red Bull </label>
                <label> <input type="radio" name="team" value="other"> Other </label>
            </fieldset>

            <fieldset>
                <legend>Content Preferences</legend>
                <label> <input type="checkbox" name="race-reports" value="chosen"> Race Reports </label>
                <label> <input type="checkbox" name="driver-news" value="chosen"> Driver News </label>
                <label> <input type="checkbox" name="tech-analysis" value="chosen"> Technical Analysis </label>
                <label> <input type="checkbox" name="history" value="chosen"> F1 History </label>

                <label>Predicted 2026 Champion*
                    <select name="champion" required>
                        <option value="none"> Please Select</option>
                        <option value="antonelli">Kimi Antonelli</option>
                        <option value="russell">George Russell</option>
                        <option value="leclerc">Charles Leclerc</option>
                        <option value="verstappen">Max Verstappen</option>
                        <option value="norris">Lando Norris</option>
                        <option value="other">Someone Else</option>
                    </select>
                </label>
            </fieldset>

            <label>Your Message or Hot Take
                <textarea name="comments" placeholder="Tell us your thoughts on the 2026 season…"></textarea>
            </label>

            <input type="submit" value="Send">
        </form>

    </main>

    <!-- start the page footer -->
    <footer>
        <p>&copy; 2026 &bull; Zoe Wink &bull; Web Essentials</p>
    </footer>
</body>

</html>
